<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felladil3 — Apps &amp; Digital Projects</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: rgba(148, 163, 184, 0.2);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0284c7;
        --border: rgba(15, 23, 42, 0.12);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    a.btn {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 500;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    a.btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    a.btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Felladil3</h1>
    <p>
      Independent developer building mobile games, utility apps, and relaxing ambient media experiences.
    </p>

    <div class="links">
      <a class="btn primary" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./app-ads.txt">app-ads.txt</a>
    </div>

    <footer>
      <span>Official developer page for <strong>felladil3.github.io</strong>.</span>
      <span> &middot; </span>
      <a href="./privacy.html">Legal &amp; Privacy</a>
    </footer>
  </main>
</body>
</html>
